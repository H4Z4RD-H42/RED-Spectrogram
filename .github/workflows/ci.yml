name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Download sox_ng
        run: python tools/fetch_sox_ng.py

      - name: Run tests
        run: pytest -q

  build:
    name: Build Windows executable
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Download sox_ng
        run: python tools/fetch_sox_ng.py

      - name: Build executable
        run: pyinstaller --noconfirm RED-Spectrogram.spec

      - name: Package
        shell: bash
        run: python tools/package_release.py "dev-${GITHUB_SHA::7}"

      - uses: actions/upload-artifact@v4
        with:
          name: RED-Spectrogram-dev-windows-x64
          path: release/*.zip
          retention-days: 14
