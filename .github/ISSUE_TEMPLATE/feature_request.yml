name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the problem or the use case, not only the solution.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: How could RED-Spectrogram help?
      description: Your idea of how it could work.
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, examples, links to similar tools...
